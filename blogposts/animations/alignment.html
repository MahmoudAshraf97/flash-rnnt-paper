  <style>
    #flash-alignment { color-scheme:light dark; --ink:#233b3a; --muted:#627472; --line:#c9d6d1; --accent:#087f78; --chip:#e0f0eb; background:transparent; color:var(--ink); font:16px/1.5 system-ui,sans-serif; max-width:760px; margin:0 auto; padding:22px 20px 14px; box-sizing:border-box; }
    :root[data-color-scheme="dark"] #flash-alignment { --ink:#e6eeeb; --muted:#a9bdb7; --line:#456157; --accent:#60d3bc; --chip:#25473d; }
    #flash-alignment svg { display:block; width:100%; height:auto; }
    #flash-alignment svg text { font-family:inherit; fill:var(--ink); }
    #flash-alignment .muted { fill:var(--muted); }
    #flash-alignment .word { animation:flash-alignment-timing 4s ease-in-out infinite; }
    #flash-alignment .hello { --start:220px; --end:280px; }

  </style>
<figure id="flash-alignment" tabindex="0" aria-label="Alignment animation. Hover or focus to pause.">
  <svg viewBox="0 0 700 215" role="img" aria-labelledby="flash-alignment-title flash-alignment-description">
    <title id="flash-alignment-title">Same words, different possible timings</title>
    <desc id="flash-alignment-description">A fixed illustrative audio waveform. The words hello and there shift between two candidate timings while keeping their order. The animation repeats every four seconds.</desc>
    <text x="350" y="25" text-anchor="middle" font-size="21" font-weight="600">Same words. Different possible timings.</text>
    <path d="M65 96 H635" stroke="var(--line)" stroke-width="1.5"/>
    <g class="wave" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"></g>
    <text x="65" y="144" font-size="13" class="muted">Audio start</text>
    <text x="635" y="144" text-anchor="end" font-size="13" class="muted">Audio end</text>
    <g class="word hello">
      <path d="M0 130 V167" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 4"/>
      <rect x="-42" y="168" width="84" height="35" rx="8" fill="var(--chip)"/>
      <text x="0" y="192" text-anchor="middle" font-size="21">hello</text>
    </g>
    <g class="word there">
      <path d="M0 130 V167" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 4"/>
      <rect x="-42" y="168" width="84" height="35" rx="8" fill="var(--chip)"/>

<script>
(() => {
  // Schematic waveform: not a recording or measured token timestamps.
  const wave=document.querySelector('#flash-alignment .wave');
  for(let i=0;i<=95;i++) {
    const t=i/95;
    const envelope=Math.exp(-(((t-.3)/.15)**2))+.8*Math.exp(-(((t-.75)/.14)**2));
    const amplitude=2+27*envelope*(.3+.7*Math.abs(Math.sin(i*1.7)));
    const bar=document.createElementNS('http://www.w3.org/2000/svg','path');
    bar.setAttribute('d','M'+(65+i*6)+' '+(96-amplitude)+' V'+(96+amplitude));
    wave.append(bar);
  }
})();
</script>
