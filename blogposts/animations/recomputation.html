  <style>
    #flash-recomputation { color-scheme:light dark; --ink:#233b3a; --muted:#627472; --line:#c9d6d1; background:transparent; color:var(--ink); font:16px/1.5 system-ui,sans-serif; max-width:820px; margin:0 auto; padding:24px 16px; box-sizing:border-box; }
    :root[data-color-scheme="dark"] #flash-recomputation { --ink:#e6eeeb; --muted:#a9bdb7; --line:#456157; }
    #flash-recomputation svg { display:block; width:100%; height:auto; }
    #flash-recomputation svg text { font-family:inherit; fill:var(--ink); }
    #flash-recomputation .muted { fill:var(--muted); }
    #flash-recomputation .tile text { fill:#fff; font-size:20px; font-weight:600; }
    #flash-recomputation .a { fill:#087f78; } #flash-recomputation .b { fill:#356fa8; } #flash-recomputation .c { fill:#99533a; }
    #flash-recomputation figcaption { text-align:center; margin-top:8px; }
    #flash-recomputation:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  </style>
<figure id="flash-recomputation" tabindex="0" aria-label="Recomputation animation. Hover or focus to pause.">
  <svg viewBox="0 0 820 370" role="img" aria-labelledby="flash-recomputation-title flash-recomputation-description">
    <title id="flash-recomputation-title">Keep everything, or recreate it when needed</title>
    <desc id="flash-recomputation-description">During forward, the left side retains three tiles of large intermediate values. Flash reuses one workspace while saving small probabilities for all three tiles. During backward, the left uses its stored values; Flash recreates and uses each tile in turn. Sizes are illustrative.</desc>
    <text class="phase" x="410" y="30" text-anchor="middle" font-size="19" font-weight="600">Forward</text>
    <text x="200" y="85" text-anchor="middle" font-size="25" font-weight="600">Save everything</text>
    <text x="620" y="85" text-anchor="middle" font-size="25" font-weight="600">Flash: reuse the space</text>
    <path d="M410 65 V350" stroke="var(--line)"/>
    <g fill="none" stroke="var(--line)" stroke-dasharray="5 5">
      <rect x="38" y="125" width="100" height="125" rx="8"/>
      <rect x="150" y="125" width="100" height="125" rx="8"/>
      <rect x="262" y="125" width="100" height="125" rx="8"/>
      <rect x="570" y="125" width="100" height="125" rx="8"/>
    </g>
    <g class="stored"></g>
    <g class="workspace"></g>
    <text x="200" y="280" text-anchor="middle" font-size="16" class="muted">Large intermediate values</text>
    <text x="620" y="280" text-anchor="middle" font-size="16" class="muted">One tile’s working space</text>
    <g class="saved"></g>
    <text x="620" y="351" text-anchor="middle" font-size="15" class="muted">Saved probabilities</text>
  </svg>
  <figcaption>
    Save the small outputs. Recreate the large intermediates when needed.
  </figcaption>
</figure>
<script>
(() => {
  const figure=document.getElementById('flash-recomputation');
  const frames = [
    {phase:'Forward', stored:[0], workspace:0, saved:1},
    {phase:'Forward', stored:[0,1], workspace:1, saved:2},
    {phase:'Forward', stored:[0,1,2], workspace:2, saved:3},
    {phase:'Calculate the loss', stored:[0,1,2], workspace:null, saved:3},
    {phase:'Backward', stored:[0,1,2], workspace:2, saved:3},
    {phase:'Backward', stored:[0,1], workspace:1, saved:3},
    {phase:'Backward', stored:[0], workspace:0, saved:3},
    {phase:'Done', stored:[], workspace:null, saved:0},
  ];
  const colors = ['a','b','c'];
  function tile(i,x) {
    return `<g class="tile"><rect class="${colors[i]}" x="${x}" y="125" width="100" height="125" rx="8"/><text x="${x+50}" y="195" text-anchor="middle">Tile ${i+1}</text></g>`;
  }
  let index=0;
  function render() {
    const frame=frames[index];
    figure.querySelector('.phase').textContent=frame.phase;
    figure.querySelector('.stored').innerHTML=frame.stored.map(i=>tile(i,38+i*112)).join('');
    figure.querySelector('.workspace').innerHTML=frame.workspace===null?'':tile(frame.workspace,570);
    figure.querySelector('.saved').innerHTML=colors.slice(0,frame.saved).map((color,i)=>
      `<g class="${color}"><circle cx="${581+i*32}" cy="315" r="5"/><circle cx="${593+i*32}" cy="315" r="5"/></g>`).join('');
  }
  const reducedMotion=matchMedia('(prefers-reduced-motion:reduce)');
  if(reducedMotion.matches) index=3;
  render();
  setInterval(()=>{
    if(!reducedMotion.matches && !figure.matches(':hover, :focus')) {
      index=(index+1)%frames.length;
      render();
    }
  },750);
})();
</script>
