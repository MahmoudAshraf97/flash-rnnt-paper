[project]
name = "flash-rnnt-paper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
paper = ["matplotlib==3.10.8", "numpy==2.4.6", "PyMuPDF==1.26.4"]
poster = [{include-group = "paper"}, "python-pptx==1.0.2", "cairosvg==2.8.2", "qrcode==8.2", "zxing-cpp==2.3.0"]
data = ["numpy==2.4.6", "datasets==4.6.0", "huggingface-hub==1.24.0", "sentencepiece==0.2.1", "requests>=2.32,<3"]

[tool.uv]
package = false
default-groups = ["paper"]

[tool.ruff.lint.per-file-ignores]
# This entry point adds the benchmark source tree before importing it.
"analysis_tools/summarize_results.py" = ["E402"]
