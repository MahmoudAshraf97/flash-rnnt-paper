[project]
name = "flash-rnnt-benchmarks"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "torch==2.14.0+cu130",
    "triton==3.8.0",
    "numba==0.65.1",
    "numba-cuda[cu13]==0.30.2",
    "nemo-toolkit[asr]",
    "transformers==5.14.1",
    "huggingface-hub==1.24.0",
    "ninja",
    "matplotlib",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
nemo-toolkit = { git = "https://github.com/MahmoudAshraf97/NeMo", rev = "c0188115c167f027b14ad550c968e9ff83ba8f7f" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
